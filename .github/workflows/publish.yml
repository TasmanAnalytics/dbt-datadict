# Triggered on push events to the main branch.
# Publishes the package to PyPI only on tag pushes.

name: 🐍 📦 Publish Python distribution to PyPI and TestPyPI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
    - name: Build distribution 📦
      run: uv build
    - name: Store the distribution artifact 🥶
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish distro to PyPI 🐍 📦
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    runs-on: ubuntu-latest
    needs: ["build"]
    environment:
      name: prod
      url: https://pypi.org/p/dbt-datadict
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      run: uv publish --trusted-publishing always

  publish-to-testpypi:
    name: Publish distro to TestPyPI 🐍 📦
    runs-on: ubuntu-latest
    needs: ["build"]
    environment:
      name: test
      url: https://test.pypi.org/p/dbt-datadict
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      run: uv publish --trusted-publishing always --index testpypi
