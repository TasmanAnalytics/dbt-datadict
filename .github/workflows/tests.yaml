# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Tests
run-name: 🧪 Tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@v4

      - name: ❄️ Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: 📦 Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 604800
          purge-primary-key: never

      - name: 🔒 Verify flake.lock is up to date
        run: nix flake lock --no-update-lock-file

      - name: 📦 Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: 🔨 Sync dependencies
        run: nix develop --no-update-lock-file --command just ensure-uv

      - name: ✅ Run unit tests
        run: nix develop --no-update-lock-file --command just test
